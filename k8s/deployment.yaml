apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcatdeploy
  labels:
    app: tomcatdeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tomcatdeploy
  template:
    metadata:
      labels:
        app: tomcatdeploy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tomcat
          image: tomcatdeploy   # replaced by kustomize in CI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
